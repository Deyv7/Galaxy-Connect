<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta no Galaxy Connect">
    <title>Galaxy Connect - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ícones Material -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Fonte Karla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="css/style-login.css">
    <link rel="icon" href="img/logo-128x128.png">
</head>

<body class="login-body">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-galaxy">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="material-symbols-outlined me-2">rocket_launch</span>
                Galaxy Connect
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <span class="material-symbols-outlined align-middle">home</span>
                            <span class="ms-1">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login">
                            <span class="material-symbols-outlined align-middle">login</span>
                            <span class="ms-1">Login</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="login-card shadow-lg">
                    <div class="login-header text-center py-4">
                        <span class="material-symbols-outlined login-icon">account_circle</span>
                        <h1 class="h3 mb-2">Acesse sua conta</h1>
                        <p class="text">Entre com suas credenciais para continuar</p>
                    </div>
                    
                    <div class="login-body px-4 pb-4">
                        <form method="POST" id="Formlogin">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <span class="material-symbols-outlined">mail</span>
                                    </span>
                                    <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <span class="material-symbols-outlined">lock</span>
                                    </span>
                                    <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">Lembrar-me</label>
                                </div>
                                <a href="/recuperar-senha" class="text-decoration-none">Esqueceu a senha?</a>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <span id="submit-text">Entrar</span>
                                <span id="submit-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                            
                            <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="mb-2">Não tem uma conta?</p>
                            <a href="/registro" class="btn btn-outline-primary">
                                <span class="material-symbols-outlined align-middle">person_add</span>
                                Criar conta
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-main bg-galaxy text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 mb-3 mb-md-0">
                    <p class="mb-0">© 2024-2025 Galaxy Connect. Todos os direitos reservados.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0">
                        Criado por <a href="https://github.com/Deyv7/" target="_blank" class="text-white fw-bold">Deyv7</a>
                        <span class="material-symbols-outlined align-middle ms-1">code</span>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle com Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Seu script de login -->
    <script src="js/login.js"></script>
</body>
</html>
