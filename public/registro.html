<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Connect - Registro</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ícones Material -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Fonte Karla -->
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="css/style-registro.css">
    <link rel="icon" href="img/logo-128x128.png">
</head>
<body class="light-mode">
    <div class="container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <div class="container-fluid">
                <a class="navbar-brand text-primary" href="/">
                    <i class="material-icons me-2">rocket_launch</i>
                    Galaxy Connect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <i class="material-icons me-1">home</i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                <i class="material-icons me-1">login</i> Login
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-primary" href="/registro">
                                <i class="material-icons me-1">flight</i> Registro
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Formulário de Registro -->
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <form method="POST" action="/registro" class="form-registro p-4 rounded shadow" id="FormRegistro">
                    <div class="text-center mb-4">
                        <i class="material-icons md-48 text-primary">flight</i>
                        <h1 class="h3 mb-3 font-weight-normal">Registro</h1>
                        <p class="text-muted">Faça seu registro para acessar a plataforma</p>
                    </div>
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Usuário</label>
                        <input type="text" id="name" name="name" class="form-control" 
                               placeholder="Digite seu usuário" pattern="[A-Za-z0-9]+" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" 
                               placeholder="Digite seu e-mail" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Digite sua senha" required pattern=".{8,}">
                        <small class="form-text text-muted">Mínimo 8 caracteres</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password-confirm" class="form-label">Confirme a Senha</label>
                        <input type="password" id="password-confirm" name="password-confirm" class="form-control" 
                               placeholder="Digite novamente sua senha" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <span id="submit-text">Registrar-se</span>
                        <span id="submit-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                    
                    <div id="error-message" class="alert alert-danger mt-3 d-none"></div>
                    
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none">Já tem uma conta? Faça login</a>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="footer-main mt-5 py-3">
            <div class="container text-center">
                <p class="mb-0 text-muted">Created By <a target="_blank" href="https://github.com/Deyv7/" class="text-primary">Deyv7</a> &copy; 2024-2025</p>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS Bundle com Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Seu script de registro -->
    <script src="js/registro.js"></script>
</body>
</html>
